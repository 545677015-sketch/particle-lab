<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D 粒子特效集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b16'/%3E%3Ccircle cx='24' cy='24' r='6' fill='%2359dcff'/%3E%3Ccircle cx='42' cy='38' r='5' fill='%23ffd98a'/%3E%3Ccircle cx='32' cy='46' r='3' fill='%23a78bfa'/%3E%3Ccircle cx='44' cy='18' r='3' fill='%236ee7c8'/%3E%3C/svg%3E">
<style>
  :root{--ink:#e9f2ff;--dim:#7f93b0;--line:rgba(150,190,255,.16);
    --a:#59dcff;--b:#a78bfa;--c:#6ee7c8;--gold:#ffd98a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05070f;color:var(--ink);overflow-x:hidden;
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:48px 20px;position:relative}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(600px 420px at 18% 8%,rgba(89,220,255,.13),transparent 70%),
      radial-gradient(560px 380px at 84% 88%,rgba(167,139,250,.13),transparent 72%),
      radial-gradient(420px 300px at 78% 10%,rgba(110,231,200,.08),transparent 70%)}
  header{text-align:center;margin-bottom:38px;position:relative;z-index:1}
  h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.18em;
    background:linear-gradient(96deg,var(--a),var(--b) 55%,var(--c));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:10px;font-size:11px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
  .grid{display:grid;gap:18px;grid-template-columns:minmax(280px,560px);
    width:min(560px,100%);justify-content:center;position:relative;z-index:1}
  .card{display:block;text-decoration:none;color:inherit;position:relative;overflow:hidden;
    border:1px solid var(--line);border-radius:18px;background:rgba(12,19,34,.62);
    backdrop-filter:blur(14px);transition:transform .28s cubic-bezier(.2,.7,.3,1),border-color .28s,box-shadow .28s}
  .card:hover{transform:translateY(-5px);border-color:rgba(89,220,255,.45);
    box-shadow:0 18px 48px rgba(0,0,0,.55),0 0 0 1px rgba(89,220,255,.12) inset}
  .thumb{display:block;aspect-ratio:16/9;overflow:hidden;background:#070b16}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s cubic-bezier(.2,.7,.3,1),filter .4s;filter:saturate(1.05)}
  .card:hover .thumb img{transform:scale(1.055)}
  .meta{padding:16px 18px 18px}
  .meta h2{margin:0 0 6px;font-size:15.5px;letter-spacing:.06em}
  .meta p{margin:0;font-size:12px;line-height:1.7;color:var(--dim)}
  .tag{display:inline-block;margin-top:11px;font-size:10px;letter-spacing:.14em;
    padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--c)}
  .tag.warm{color:var(--gold);border-color:rgba(255,217,138,.28)}
  footer{margin-top:34px;font-size:11px;color:var(--dim);letter-spacing:.1em;
    text-align:center;line-height:1.9;position:relative;z-index:1}
  footer a{color:var(--a);text-decoration:none}
  @media (max-width:560px){
    body{padding:32px 14px}
    h1{font-size:21px;letter-spacing:.14em}
    .sub{font-size:9.5px;letter-spacing:.26em}
    header{margin-bottom:26px}
  }
</style>
</head>
<body>
  <header>
    <h1>3D 粒子特效集</h1>
    <div class="sub">Particle Lab · Three.js</div>
  </header>

  <main class="grid">
    <a class="card" href="gesture-stardust.html">
      <span class="thumb"><img src="screenshots/gesture-idle.png" alt="手势星尘"></span>
      <div class="meta">
        <h2>手势星尘</h2>
        <p>摄像头识别手掌，8 万星尘随张开、捏合、握拳聚散。无摄像头时可用鼠标与按钮演示。</p>
        <span class="tag">8 万粒子 · 手势交互</span>
      </div>
    </a>
  </main>

  <footer>
    纯静态单文件 · three.js r160 · MediaPipe HandLandmarker<br>
    摄像头手势需 HTTPS（本站已启用）
  </footer>
</body>
</html>
